format:
  html:
    theme:
      - darkly
      - styles/custom.scss
    toc: true
    toc-depth: 3
    code-fold: true
    link-external-newwindow: true
    include-after-body:
      - styles/tasks.html
      # - styles/glossary.html
    include-in-header: styles/macros.html
    bibliography: literature/references.bib

filters:
  - glossary.lua
