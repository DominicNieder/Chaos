project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "topics/**/*.qmd"
    - "!glossary.qmd"
  resources:
    - "pic/**"
    - "figures/**"
    - "topics/**/*.html"

website:
  title: "Chaos"
  # page-footer:
  #   center: "Built with [Quarto](https://quarto.org)"
  sidebar:
    contents:
      - index.qmd
      - topics/day-logs/index.qmd
      - section: "Topics"
        contents:
          - topics/Theory/index.qmd
          - topics/henon-heiles/index.qmd
          - topics/self-organized-criticallity/index.qmd
      - section: "Logs"
        contents:
          - topics/26-08-03-log/index.qmd
          - topics/26-07-14-log/index.qmd
          - topics/26-07-08-log/index.qmd
          - topics/26-07-07-log/index.qmd
          - topics/26-06-20-log/index.qmd
          - topics/26-06-19-log/index.qmd
          - topics/26-06-17-log/index.qmd
          - topics/26-06-15-log/index.qmd
          - topics/26-06-14-log/index.qmd
          - topics/26-06-12-log/index.qmd
          - topics/26-06-11-log/index.qmd
          - topics/26-06-09-log/index.qmd
