<script>
document.addEventListener('DOMContentLoaded', () => {
  const terms = {
    "diffeomorphism": "A continuously differentiable map $f: N \\to M$ between two manifolds, such that $f^{-1}: M \\to N$ is also differentiable. If $f$ is $r$-times differentiable it is called a $C^r$-diffeomorphism.",
    "hyper surfaces": "Coming from the analogy of a surface in 3D space is a 2D object. An geometric object that lives in a $n$–dimensional space, though itself is a $n-1$–dimensinal object. ",
    "trajectory": "A mathematical 1 dimensional object, that describes a dynamics of a system.",
    "ergodic trajectory": "A trajectory that will fill th whole volume of the accessible phase space.",
    "critical point": "A point in state-space, for which a continuous transition between two states exists.",
    "Hamiltonian": "The total energy function of a system, made of the sum of the kinetic and potential energy.",
    "kinetic energy": "Is the energy that is in the form of motion of a massive objects. It is defined by $\\hat{T}=\\sum_i\\tfrac{p_i^2}{2m}$ for all particles labeled $i$",
    "potential energy": "Is the energy that is stored in the interaction that the particles obey. It carries the potential to transform it into kinetic energy i.e. movement.",
    "surface of section": "A surface cutting through the phase space. This registers the trajectory that passes through it. This can have constraints i.e. in a 4D phase-space $p_x\\geq 0$",
    "configuration space": "The space of all possible positions $\\vec{x}_i \\in \\mathbff{R}^3$, for all $N$ particles $1\\leq i \\leq N$. I am wondering, what about time?",
    "phase space": "The space of all possible states, with axes for each canonical coordinates – position $q_i$ and momentum $p_i$.",
    "state": "Describes a system dialectically. One state can become another. Often 'state' can be used to describe synonymously to 'mode' or a 'function-type' of a system. The state is determined by boundry–, including initial-conditions.",
    "orbit": "Similar to a state (i.e. in QM). Only that this is referred to trajectories. Or when the system is a dynamical system itself, (i.e. configuration space, phase-space). ",
    "Hénon-Heiles potential": "Two-dimensional potential: $U = \\tfrac{m \\omega^2}{2}(x^2+y^2)+\\alpha(x^2y-\\tfrac{1}{3}y^3)$. It is a model describing stellar motion in a galaxy and is used to study chaos.",
  };
  const walker = document.createTreeWalker(
    document.querySelector("main") || document.body,
    NodeFilter.SHOW_TEXT
  );
  const sorted = Object.keys(terms).sort((a, b) => b.length - a.length);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    if (node.parentElement.closest("code, pre, script, style, abbr")) return;
    let html = node.textContent.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let text = node.textContent;
    let result = text;
    sorted.forEach(term => {
      const re = new RegExp("\\b(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")\\b", "gi");
      result = result.replace(re, `<abbr title="${terms[term]}">$1</abbr>`);
    });
    if (result !== text) {
      const span = document.createElement("span");
      span.innerHTML = result;
      node.parentElement.replaceChild(span, node);
    }
  });
});
</script>
